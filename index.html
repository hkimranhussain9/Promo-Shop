<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
        }
        .loader {
            text-align: center;
            color: #e0e0e0;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #242424;
            border-top: 4px solid #10b981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader p {
            font-size: 14px;
            color: #a0a0a0;
        }
    </style>
    <!-- 👇 এখানে আপনার আসল সাইটের লিংক দিন -->
    <meta http-equiv="refresh" content="0; url=https://promo-shop-live.netlify.app">
    <script>
        // 👇 এখানে আপনার আসল সাইটের লিংক দিন
        window.location.replace("https://promo-shop-live.netlify.app");
    </script>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Redirecting to <strong>Promo Shop</strong>...</p>
        <p style="font-size:12px;margin-top:10px;color:#666;">
            <!-- 👇 এখানে আপনার আসল সাইটের লিংক দিন -->
            <a href="https://promo-shop-live.netlify.app" style="color:#10b981;text-decoration:none;">
                Click here if not redirected
            </a>
        </p>
    </div>
</body>
</html>
